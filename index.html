<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>のりかえ</title>
    <style>
      :root {
        --bg: #fff7fa;
        --card: #ffffff;
        --pink: #f28bb4;
        --pink-dark: #c2627f;
        --pink-soft: #ffe3ee;
        --pink-softer: #fff0f5;
        --text: #3a2b32;
        --text-sub: #8a6b76;
        --line: #f6cfdd;
        --warn: #f08c3c;
        --warn-dark: #b95d10;
        --shadow: 0 4px 16px rgba(194, 98, 127, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241419;
          --card: #33202a;
          --pink: #f28bb4;
          --pink-dark: #f4a9c6;
          --pink-soft: #4a2436;
          --pink-softer: #3a1f2d;
          --text: #fbeef3;
          --text-sub: #c9a3b2;
          --line: #553544;
          --warn: #f08c3c;
          --warn-dark: #f5ab63;
          --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      h1 {
        font-size: 30px;
        margin: 4px 0 2px;
        letter-spacing: 0.04em;
      }
      .now-line {
        color: var(--text-sub);
        font-size: 14px;
        margin: 0 0 16px;
      }
      .now-line strong { color: var(--pink-dark); font-weight: 700; }

      /* ゆき／かえり タブ */
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .tab {
        flex: 1;
        min-height: 56px;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--text-sub);
        border-radius: 999px;
        font-size: 20px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        padding: 10px 8px;
      }
      .tab .route-mini { display: block; font-size: 12px; font-weight: 400; margin-top: 2px; }
      .tab.active {
        background: var(--pink);
        border-color: var(--pink);
        color: #fff;
      }
      .tab.active .route-mini { color: #ffe9f2; }

      /* 駅チップ */
      .chips { display: flex; gap: 8px; margin-bottom: 10px; }
      .chip-label { font-size: 13px; color: var(--text-sub); align-self: center; white-space: nowrap; }
      .chip {
        flex: 1;
        min-height: 48px;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 14px;
        font-size: 17px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        padding: 8px 4px;
      }
      .chip.active {
        background: var(--pink-soft);
        border-color: var(--pink);
        color: var(--pink-dark);
      }

      /* ダイヤ切替 */
      .dia-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
      }
      .dia-row .chip-label { margin-right: 2px; }
      .dia-btn {
        min-height: 40px;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--text-sub);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        padding: 6px 14px;
      }
      .dia-btn.active {
        background: var(--pink-dark);
        border-color: var(--pink-dark);
        color: #fff;
      }

      /* さがし方（いま／出発時刻／到着時刻） */
      .mode-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .mode-btn {
        min-height: 44px;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--text-sub);
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        padding: 8px 16px;
      }
      .mode-btn.active {
        background: var(--pink-dark);
        border-color: var(--pink-dark);
        color: #fff;
      }
      .time-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .time-row[hidden] { display: none; }
      #timeInput {
        font-family: inherit;
        font-size: 24px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background: var(--card);
        border: 2px solid var(--pink);
        border-radius: 14px;
        padding: 8px 14px;
        min-height: 54px;
      }
      .time-hint { font-size: 13px; color: var(--text-sub); }
      .search-note {
        font-size: 14px;
        font-weight: 700;
        color: var(--pink-dark);
        margin: 0 0 10px;
      }
      .search-note:empty { display: none; }

      /* 結果カード */
      .card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 20px;
        padding: 16px 18px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .card.fastest {
        border-color: var(--pink);
        background: linear-gradient(180deg, var(--pink-softer), var(--card));
        padding: 20px 18px;
      }
      .badge {
        display: inline-block;
        background: var(--pink);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        border-radius: 999px;
        padding: 4px 12px;
        margin-bottom: 8px;
      }
      .badge.same {
        background: var(--pink-soft);
        color: var(--pink-dark);
      }
      .depart {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 10px;
      }
      .depart .d-sta { font-size: 19px; font-weight: 700; }
      .depart .d-time {
        font-size: 36px;
        font-weight: 800;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .card.fastest .depart .d-time { font-size: 44px; color: var(--pink-dark); }
      .depart .d-suffix { font-size: 16px; font-weight: 700; color: var(--text-sub); margin-left: -6px; }
      .depart .in-min { align-self: center; }
      .arrive-final {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
        font-size: 16px;
        font-weight: 700;
      }
      .arrive-final .a-time { font-variant-numeric: tabular-nums; }
      .total { font-size: 13px; font-weight: 400; color: var(--text-sub); margin-left: auto; white-space: nowrap; }
      .legs { margin-top: 10px; font-size: 14px; line-height: 1.5; }
      .leg { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
      .leg .time { font-weight: 700; font-variant-numeric: tabular-nums; }
      .leg .line-name {
        font-size: 12px;
        font-weight: 700;
        border-radius: 6px;
        padding: 1px 7px;
        white-space: nowrap;
      }
      .line-toyoko { background: var(--pink-soft); color: var(--pink-dark); }
      .line-keikyu { background: #fde8e8; color: #b23a3a; }
      @media (prefers-color-scheme: dark) {
        .line-keikyu { background: #4a2323; color: #f0a3a3; }
      }
      .leg .meta { color: var(--text-sub); font-size: 13px; }
      .in-min {
        display: inline-block;
        background: var(--pink-dark);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        border-radius: 999px;
        padding: 2px 10px;
      }
      .transfer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 14px;
        font-weight: 700;
        margin: 8px 0 8px 10px;
        padding: 2px 0 2px 10px;
        border-left: 3px dotted var(--line);
      }
      .transfer-row .t-min { font-variant-numeric: tabular-nums; }
      .transfer-row.tight { color: var(--warn-dark); }
      .tight-tag {
        background: var(--warn);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        padding: 2px 10px;
        line-height: 1.5;
      }
      .train-notes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 5px 0 2px 10px;
      }
      .note {
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        padding: 2px 10px;
        line-height: 1.5;
      }
      .note-2100 { background: #e3edfb; color: #2b50a0; }
      .note-cut { background: var(--pink-dark); color: #fff; }
      .note-join {
        background: var(--pink-soft);
        color: var(--pink-dark);
        border: 1px solid var(--pink);
      }
      @media (prefers-color-scheme: dark) {
        .note-2100 { background: #26334f; color: #a9c2f5; }
      }
      .empty {
        background: var(--card);
        border: 2px dashed var(--line);
        border-radius: 20px;
        padding: 32px 20px;
        text-align: center;
        font-size: 16px;
        line-height: 1.7;
        color: var(--text-sub);
      }
      footer {
        margin-top: 24px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--text-sub);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🎀 のりかえ</h1>
      <p class="now-line">いま <strong id="nowTime">--:--</strong> ・ <span id="diaName">―</span></p>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabGo" type="button">ゆき<span class="route-mini">妙蓮寺 → 横浜 → 京急</span></button>
        <button class="tab" id="tabBack" type="button">かえり<span class="route-mini">京急 → 横浜 → 妙蓮寺</span></button>
      </div>

      <div class="chips">
        <span class="chip-label" id="chipLabel">目的地</span>
        <button class="chip active" id="chipChuo" type="button">横須賀中央</button>
        <button class="chip" id="chipHakkei" type="button">金沢八景</button>
      </div>

      <div class="dia-row">
        <span class="chip-label">ダイヤ</span>
        <button class="dia-btn active" data-dia="auto" type="button">自動</button>
        <button class="dia-btn" data-dia="weekday" type="button">平日</button>
        <button class="dia-btn" data-dia="saturday" type="button">土曜</button>
        <button class="dia-btn" data-dia="holiday" type="button">休日</button>
      </div>

      <div class="mode-row">
        <span class="chip-label">さがし方</span>
        <button class="mode-btn active" data-mode="now" type="button">いま</button>
        <button class="mode-btn" data-mode="dep" type="button">出発時刻</button>
        <button class="mode-btn" data-mode="arr" type="button">到着時刻</button>
      </div>

      <div class="time-row" id="timeRow" hidden>
        <span class="chip-label" id="timeLabel">出発</span>
        <input type="time" id="timeInput" step="60" />
        <span class="time-hint" id="timeHint"></span>
      </div>

      <p class="search-note" id="searchNote"></p>
      <div id="results"></div>

      <footer>
        <p>時刻表ベースの計算だよ。所要時間は目安で、遅延は反映されないよ。<br>
        横浜での乗り換えは4分以上あけた便だけ出してるよ（3分以下は除外）。4分はギリギリだから急いでね。<br>
        京急は11/21（土休日）・11/24（平日）にダイヤ変更予定。今のデータは変更前の時刻表だよ。</p>
      </footer>
    </main>

      var BUFFER = 4;      // 横浜での乗り換え最低時間（分）※4分はギリギリで残す・4分より短い（3分以下）と無理なので候補から除外する
      var TOYOKO_MIN = 7;  // 妙蓮寺⇔横浜の所要（分）
      var MAX_LEG1 = 8;

      var state = {
        dir: new Date().getHours() < 13 ? 'go' : 'back',  // 初期表示：13時前はゆき・以降はかえり
        station: 'chuo',  // 'chuo' 横須賀中央 / 'hakkei' 金沢八景
        dia: 'auto',      // 'auto' / 'weekday' / 'saturday' / 'holiday'
        mode: 'now',      // 'now' いま / 'dep' 出発時刻指定 / 'arr' 到着時刻指定
        timeMin: null     // 指定時刻（0時からの分）。mode が dep/arr のとき使う
      };

      function fmt(m) {
        var h = Math.floor(m / 60);
        var mm = m % 60;
        return h + ':' + (mm < 10 ? '0' : '') + mm;
      }
      function fmtPad(m) {
        var h = Math.floor(m / 60);
        var mm = m % 60;
        return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
      }
      function durText(min) {
        if (min >= 60) {
          var h = Math.floor(min / 60), r = min % 60;
          return r === 0 ? h + '時間' : h + '時間' + r + '分';
        }
        return min + '分';
      }
      function autoDiaKey(date) {
        var d = date.getDay();
        if (d === 0) return 'holiday';
        if (d === 6) return 'saturday';
        return 'weekday';
      }
      function diaKey(date) {
        return state.dia === 'auto' ? autoDiaKey(date) : state.dia;
      }

      // 第1レグ候補（{dep, arr, type, dest} の配列）を作る
      function leg1List(data) {
        var out = [];
        if (state.dir === 'go') {
          data.myoToYoko.forEach(function (dep) {
            out.push({ dep: dep, arr: dep + TOYOKO_MIN, type: null, dest: null, line: 'toyoko' });
          });
        } else {
          var src = state.station === 'chuo' ? data.chuoToYoko : data.hakkeiToYoko;
          src.forEach(function (e) {
            out.push({ dep: e[0], arr: e[1], type: e[2], dest: e[3], bunko: e[4], is2100: e[5], line: 'keikyu' });
          });
        }
        return out;
      }
      // 第2レグ候補（同じ形）を作る
      function leg2List(data) {
        var out = [];
        if (state.dir === 'go') {
          var src = state.station === 'chuo' ? data.yokoToChuo : data.yokoToHakkei;
          src.forEach(function (e) {
            out.push({ dep: e[0], arr: e[1], type: e[2], dest: e[3], bunko: e[4], is2100: e[5], line: 'keikyu' });
          });
        } else {
          data.yokoToMyo.forEach(function (dep) {
            out.push({ dep: dep, arr: dep + TOYOKO_MIN, type: null, dest: null, line: 'toyoko' });
          });
        }
        return out;
      }

      function compute(nowMin, data) {
        var l1 = leg1List(data), l2 = leg2List(data);
        var results = [];
        var taken = 0;
        for (var i = 0; i < l1.length && taken < MAX_LEG1; i++) {
          var a = l1[i];
          if (a.dep < nowMin) continue;
          taken++;
          var need = a.arr + BUFFER;
          var b = null;
          for (var j = 0; j < l2.length; j++) {
            if (l2[j].dep >= need) { b = l2[j]; break; }
          }
          if (!b) continue;
          results.push({ leg1: a, leg2: b, wait: b.dep - a.arr, finalArr: b.arr });
        }
        results.sort(function (x, y) {
          if (x.finalArr !== y.finalArr) return x.finalArr - y.finalArr;
          return x.leg1.dep - y.leg1.dep;
        });
        return results.slice(0, 3);
      }

      // 到着時刻指定：targetMin までに着く便を、遅く出られる順に最大3件
      function computeArr(targetMin, data) {
        var l1 = leg1List(data), l2 = leg2List(data);
        var results = [];
        for (var i = 0; i < l1.length; i++) {
          var a = l1[i];
          var need = a.arr + BUFFER;
          var b = null;
          for (var j = 0; j < l2.length; j++) {
            if (l2[j].dep >= need) { b = l2[j]; break; }
          }
          if (!b) continue;
          if (b.arr > targetMin) continue;
          results.push({ leg1: a, leg2: b, wait: b.dep - a.arr, finalArr: b.arr });
        }
        results.sort(function (x, y) {
          if (x.leg1.dep !== y.leg1.dep) return y.leg1.dep - x.leg1.dep;
          return y.finalArr - x.finalArr;
        });
        return results.slice(0, 3);
      }

      function trainNotesHtml(leg) {
        if (leg.line !== 'keikyu') return '';
        var notes = '';
        if (leg.is2100) {
          notes += '<span class="note note-2100">2100形（2ドア）</span>';

            notes += leg.bunko === 'front'

          } else {
            notes += leg.bunko === 'front'
              ? '<span class="note note-join">文庫で前4両増結</span>'
              : '<span class="note note-join">文庫で後4両増結</span>';
          }
        }
        return notes ? '<div class="train-notes">' + notes + '</div>' : '';
      }

      function legHtml(leg, fromName, toName) {
        var lineLabel = leg.line === 'toyoko' ? '東横線' : '京急';
        var lineCls = leg.line === 'toyoko' ? 'line-toyoko' : 'line-keikyu';
        var meta = '';
        if (leg.line === 'keikyu' && leg.type) meta = leg.type + '・' + leg.dest + '行き';
        if (leg.line === 'toyoko') meta = '各停';
        return '<div class="leg">' +
          '<span class="line-name ' + lineCls + '">' + lineLabel + '</span>' +
          '<span>' + fromName + ' <span class="time">' + fmt(leg.dep) + '</span>発 → ' +
          toName + ' <span class="time">' + fmt(leg.arr) + '</span>着</span>' +
          (meta ? '<span class="meta">' + meta + '</span>' : '') +
          '</div>' + trainNotesHtml(leg);
      }

          if (state.mode === 'arr') {
            if (isBest) html += '<span class="badge">🎀 いちばん遅く出られる</span>';
          } else if (isBest) html += '<span class="badge">🎀 いちばん早く着く</span>';
          else if (sameAsBest) html += '<span class="badge same">後から出ても同じ到着</span>';
          var inMin;
          if (state.mode === 'dep') {
            var dDep = r.leg1.dep - refMin;
            inMin = dDep <= 0 ? '指定時刻の便' : '指定時刻の' + dDep + '分後';
          } else if (state.mode === 'arr') {
            var margin = state.timeMin - r.finalArr;
            inMin = margin <= 0 ? 'ぎりぎり到着' : margin + '分前に着く';
          } else {
            var diff = r.leg1.dep - nowMin;
            inMin = diff <= 0 ? 'まもなく発車' : 'あと' + diff + '分';
          }
          html += '<div class="depart">' +
            '<span class="d-sta">' + fromStation + '</span>' +
            '<span class="d-time">' + fmt(r.leg1.dep) + '</span><span class="d-suffix">発</span>' +
            '<span class="in-min">' + inMin + '</span>' +
            '</div>';
          html += '<div class="legs">';
          html += legHtml(r.leg1, fromStation, '横浜');
          var tight = r.wait <= 5;
          var tightLabel = r.wait <= 4 ? 'ギリギリ！急いでね' : 'タイト！急いでね';
          html += '<div class="transfer-row' + (tight ? ' tight' : '') + '">' +
            '横浜でのりかえ <span class="t-min">' + r.wait + '分</span>' +
            (tight ? '<span class="tight-tag">' + tightLabel + '</span>' : '') +
            '</div>';
          html += legHtml(r.leg2, '横浜', toStation);
          html += '</div>';
          html += '<div class="arrive-final">' + toStation + ' <span class="a-time">' + fmt(r.finalArr) + '</span>着' +
            '<span class="total">所要 約' + durText(r.finalArr - r.leg1.dep) + '</span></div>';
          html += '</div>';
        });
        box.innerHTML = html;
      }

      function syncControls() {
        document.getElementById('tabGo').classList.toggle('active', state.dir === 'go');
        document.getElementById('tabBack').classList.toggle('active', state.dir === 'back');
        document.getElementById('chipChuo').classList.toggle('active', state.station === 'chuo');
        document.getElementById('chipHakkei').classList.toggle('active', state.station === 'hakkei');
        document.getElementById('chipLabel').textContent =
          state.dir === 'go' ? '目的地' : '出発地';
        var btns = document.querySelectorAll('.dia-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle('active', btns[i].getAttribute('data-dia') === state.dia);
        }
        var mbtns = document.querySelectorAll('.mode-btn');
        for (var k = 0; k < mbtns.length; k++) {
          mbtns[k].classList.toggle('active', mbtns[k].getAttribute('data-mode') === state.mode);
        }
        var tRow = document.getElementById('timeRow');
        if (state.mode === 'now') {
          tRow.hidden = true;
        } else {
          tRow.hidden = false;
          document.getElementById('timeLabel').textContent = state.mode === 'dep' ? '出発' : '到着';
          document.getElementById('timeHint').textContent =
            state.mode === 'dep' ? 'この時刻以降に出発する便' : 'この時刻までに到着する便';
          if (state.timeMin != null) {
            document.getElementById('timeInput').value = fmtPad(state.timeMin);
          }
        }
      }

      document.getElementById('tabGo').addEventListener('click', function () {
        state.dir = 'go'; syncControls(); render();
      });
      document.getElementById('tabBack').addEventListener('click', function () {
        state.dir = 'back'; syncControls(); render();
      });
      document.getElementById('chipChuo').addEventListener('click', function () {
        state.station = 'chuo'; syncControls(); render();
      });
      document.getElementById('chipHakkei').addEventListener('click', function () {
        state.station = 'hakkei'; syncControls(); render();
      });
      var diaBtns = document.querySelectorAll('.dia-btn');
      for (var i = 0; i < diaBtns.length; i++) {
        diaBtns[i].addEventListener('click', function () {
          state.dia = this.getAttribute('data-dia'); syncControls(); render();
        });
      }
      var modeBtns = document.querySelectorAll('.mode-btn');
      for (var m = 0; m < modeBtns.length; m++) {
        modeBtns[m].addEventListener('click', function () {
          var md = this.getAttribute('data-mode');
          state.mode = md;
          if (md !== 'now' && state.timeMin == null) {
            var n = new Date();
            var base = n.getHours() * 60 + n.getMinutes();
            state.timeMin = md === 'arr' ? Math.min(base + 60, 23 * 60 + 59) : base;
          }
          syncControls(); render();
        });
      }
      function onTimeChange() {
        var v = document.getElementById('timeInput').value;
        if (v) {
          var parts = v.split(':');
          state.timeMin = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }
        render();
      }
      document.getElementById('timeInput').addEventListener('change', onTimeChange);
      document.getElementById('timeInput').addEventListener('input', onTimeChange);

      syncControls();
      render();
      setInterval(render, 30 * 1000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) render();
      });
      window.addEventListener('focus', render);
      window.addEventListener('pageshow', render);
    </script>
  </body>
</html>
